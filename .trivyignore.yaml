vulnerabilities:
  - id: CVE-2023-45853
    purls:
      - "pkg:deb/debian/zlib1g@1.2.13.dfsg-1?arch=amd64&distro=debian-12.15&epoch=1"
    expired_at: 2026-11-05
    statement: "Debian bookworm marks zlib <ignored>: the vulnerable MiniZip contrib is not built into the shipped zlib1g binary (vulnerable code not present). Not reachable at runtime."
  - id: CVE-2025-7458
    purls:
      - "pkg:deb/debian/libsqlite3-0@3.40.1-2%2Bdeb12u2?arch=amd64&distro=debian-12.15"
    expired_at: 2026-11-05
    statement: "Debian <no-dsa> (minor). Exploit needs arbitrary SQL execution; QM removed SQLite entirely at this source revision, libsqlite3-0 remains only as a transitive OS dependency. Contained by sandbox: non-root agent, cap-drop ALL, no-new-privileges, read-only rootfs."
  - id: CVE-2026-13221
